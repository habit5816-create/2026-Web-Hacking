<p><b>강의 제목:</b> 어떻게 숨겨진 필드를 이용한 것인가 </p>

<p><b>강의 주제 및 개념:</b> </p>

개발자는 읽어들인 페이지에 트랙킹, 로그인, 가격 설정등을 숨겨진 필드로 사용할 것입니다.
이것이 개발자에게 쉽고 용이한 메커니즘인 반면, 때때로 숨겨진 필드에서 얻어지는 정보를 검증하지 않습니다.
이번 수업은 공격자들에게 명기된 가격보다 다른 가격을 얻기 위해 숨겨진 필드를 찾고 수정하는 법을 가르칠 것입니다.
<br>
<br>
<p><b>학습 목표:</b> </p>

사용자는 숨겨진 필드를 공격하여 제품의 다른 가격을 얻을 수 있습니다.<br><br>
