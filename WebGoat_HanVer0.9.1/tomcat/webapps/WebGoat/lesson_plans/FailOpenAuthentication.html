<p><b>강의 주제 및 개념:</b> </p>
이번 수업은 인증에 관한 &#8220;개방실패&#8220; 상태의 이해를 위한 기초를 보여줍니다.
보안 용어,&#8220;개방실패&#8220;는 검증 매카니즘의 작동을 설명한다. <br>
이것은 검증 메소드가 메소드를 참으로 평가할 때 에러(다시말하면 예상치못한 예외)가 발생합니다.<br>
이것은 특히 로그인하는 과정에서 위험합니다. <br>
 
<p><b>학습 목표:</b> </p>

사용자는 인증 검사를 우회할 수 있어야 합니다.<br>
